name: "Setup MailerLite deploy toolchain (devbox hybrid)"
description: >
  Installs Nix + devbox and provisions the deploy toolchain onto PATH.
  Replaces the swiss-army-knife CI container. kubectl/skaffold/cue/gh/sops/jq
  are version-pinned in devbox.json; gcloud(+gke-gcloud-auth-plugin) and
  helm(+helm-secrets) come from the ./nix flake. Call this before any step
  that shells out to gcloud/skaffold/helm/kubectl.
runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Provision deploy toolchain (devbox hybrid)
      shell: bash
      run: |
        set -euo pipefail
        # devbox drives Nix underneath; install it into the Nix profile.
        nix profile add nixpkgs#devbox

        # Copy the config OUT of the action checkout into a scratch dir before
        # running devbox. Running it in-place would drop a .devbox/ profile
        # (a symlink into the read-only /nix/store) inside _actions/, which
        # breaks GitHub's "Prepare workflow directory" on snapshot restore.
        src="$(cd "${{ github.action_path }}/.." && pwd)"
        work="${RUNNER_TEMP}/mlr-deploy-toolchain"
        mkdir -p "$work"
        cp "$src/devbox.json" "$work/devbox.json"
        cp "$src/devbox.lock" "$work/devbox.lock" 2>/dev/null || true
        cp -R "$src/nix" "$work/nix"
        cd "$work"
        devbox install

        # Put the whole devbox profile (pinned CLIs + ./nix flake outputs:
        # gcloud+gke-gcloud-auth-plugin, helm+helm-secrets) on PATH for
        # subsequent steps/jobs.
        echo "$work/.devbox/nix/profile/default/bin" >> "$GITHUB_PATH"

        # Env the swiss-army-knife container used to bake in: ADC for
        # `gcloud auth application-default …`, and the GKE auth plugin toggle.
        # The key file is written later by the deploy action's authenticate step.
        {
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json"
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True"
        } >> "$GITHUB_ENV"
